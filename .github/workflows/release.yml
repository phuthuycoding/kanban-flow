name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm --provenance

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      notes: ${{ steps.notes.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json and the CHANGELOG
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg — bump and retag" >&2
            exit 1
          fi
          if ! grep -q "^## \[${pkg}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$pkg]' section — write it before tagging" >&2
            exit 1
          fi
          echo "value=$pkg" >> "$GITHUB_OUTPUT"

      - name: Extract the release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          awk -v v="${{ steps.version.outputs.value }}" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          base64 -w0 notes.md > notes.b64
          echo "value=$(cat notes.b64)" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Publishes via npm trusted publishing (OIDC): no token in the repo, provenance automatic.
  # Requires the one-time publisher link on npmjs.com (package → Trusted Publisher →
  # GitHub Actions: phuthuycoding / kanban-flow / release.yml) and npm CLI >= 11.5.1.
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm install -g npm@latest
      - run: npm publish

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub release from the tag's CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_B64: ${{ needs.verify.outputs.notes }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          echo "$NOTES_B64" | base64 -d > notes.md
          gh release create "v$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md \
            --verify-tag
