name: Release

# The release IS the trigger: `gh release create v0.7.0` (or the web UI) creates the tag
# and the release in one step, then this workflow verifies and publishes to npm.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json and the CHANGELOG
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$pkg" ]; then
            echo "release tag $tag does not match package.json version v$pkg — fix the tag or the version and republish" >&2
            exit 1
          fi
          if ! grep -q "^## \[${pkg}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$pkg]' section — write it before publishing" >&2
            exit 1
          fi
          echo "value=$pkg" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Publishes via npm trusted publishing (OIDC): no token in the repo, provenance automatic.
  # Requires the one-time publisher link on npmjs.com (package → Trusted Publisher →
  # GitHub Actions: phuthuycoding / kanban-flow / release.yml) and npm CLI >= 11.5.1.
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm install -g npm@latest
      - run: npm publish
