name: Release

# The release IS the trigger: `gh release create v0.7.0` (or the web UI) creates the tag
# and the release in one step, then this workflow verifies and publishes to npm.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$pkg" ]; then
            echo "release tag $tag does not match package.json version v$pkg — fix the tag or the version and republish" >&2
            exit 1
          fi
          echo "value=$pkg" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Publishes via npm trusted publishing (OIDC): no token in the repo, provenance automatic.
  # Requires the one-time publisher link on npmjs.com (package → Trusted Publisher →
  # GitHub Actions: phuthuycoding / kanban-flow / release.yml) and npm CLI >= 11.5.1.
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm install -g npm@latest
      - run: npm publish

  # Housekeeping after a successful publish: keep only the 10 newest release
  # tags (and their GitHub releases) and the 10 newest release branches
  # (release/*, release-* and */release-* names). Branches behind an open PR
  # are never touched.
  prune:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # deletes tag and branch refs, and their releases
    steps:
      - name: Prune to the 10 newest release tags and branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          keep=10

          tags="$(gh api --paginate "repos/$REPO/git/matching-refs/tags" --jq '.[].ref' \
            | sed 's|refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
          total="$(printf '%s\n' "$tags" | grep -c . || true)"
          if [ "$total" -gt "$keep" ]; then
            printf '%s\n' "$tags" | head -n "$((total - keep))" | while read -r tag; do
              # --cleanup-tag removes the tag with its release; plain refs fall back to a ref delete.
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null \
                || gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
            done
          fi

          open_heads="$(gh pr list --repo "$REPO" --state open --json headRefName --jq '.[].headRefName')"
          branches="$(gh api --paginate "repos/$REPO/git/matching-refs/heads" --jq '.[].ref' \
            | sed 's|refs/heads/||' | grep -E '(^|/)release[-/]' | sort -V)"
          total="$(printf '%s\n' "$branches" | grep -c . || true)"
          if [ "$total" -gt "$keep" ]; then
            printf '%s\n' "$branches" | head -n "$((total - keep))" | while read -r branch; do
              grep -qxF "$branch" <<< "$open_heads" \
                || gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            done
          fi
