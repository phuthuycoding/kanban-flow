name: CI

on:
  push:
    branches: [main]
  pull_request:

# Concurrency keys on the ref: a newer push on a PR cancels the stale run, but a
# push to main must finish — cancelling it could drop the only green signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The living-docs check needs the merge-base with the PR's base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # --strict: a merge-base that cannot be resolved fails here instead of degrading to a WARNING.
      - if: github.event_name == 'pull_request'
        run: node dist/index.js validate --all --strict --base origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
